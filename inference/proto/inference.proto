syntax = "proto3";
package inference;

option go_package = "github.com/aluko123/go-network-proxy/inference/pb";

service ModelService {
  // Stream tokens back to the gateway
  rpc Generate (GenerateRequest) returns (stream TokenResponse);
  // Check worker health and load
  rpc Health (HealthRequest) returns (HealthResponse);
}

message GenerateRequest {
  string request_id = 1;
  string model = 2;
  string prompt = 3;
  float temperature = 4;
  int32 max_tokens = 5;
  int32 priority = 6; // 0=Low, 1=High (For Priority Queue)
  string prefix = 7;  // Cacheable prefix for KV cache reuse (system prompt, etc.)
}

message TokenResponse {
  string request_id = 1;
  string token = 2;
  bool finished = 3;
  string error = 4;
  int32 token_count = 5;  // Cumulative tokens generated so far
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  int32 current_queue_size = 2;
  float gpu_utilization = 3; // Useful for load balancing!
  
  // GPU memory for memory-aware routing (Phase 3)
  int64 gpu_memory_used = 4;   // Bytes used
  int64 gpu_memory_total = 5;  // Total bytes available
  
  // GPU topology for multi-node awareness (ML Workloads focus)
  int32 gpu_count = 6;              // Number of GPUs on this worker
  string gpu_type = 7;              // e.g., "A100-80GB", "H100"
  string interconnect_type = 8;     // "nvlink", "pcie", "none"
  
  // InfiniBand status for distributed inference/training
  bool ib_available = 9;            // Is InfiniBand present?
  string ib_state = 10;             // "Active", "Down", "Init"
  int32 ib_width = 11;              // Link width (1, 4)
  string ib_speed = 12;             // "HDR", "NDR", "EDR"
}
